version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://app_user:app_password@db:5432/app_db
      - SECRET_KEY=gfdmhghif38yrf9ew0jkf32 # Ключ для JWT и подписи вебхуков
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python migrate.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: